# Builds standalone executables with PyInstaller (it can't cross-compile, so one
# runner per platform). Push a tag like v0.1.0 to publish a GitHub release;
# run manually from the Actions tab to just get the builds as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: huligennem-windows-x64.exe
          - os: macos-latest  # Apple Silicon; DearPyGui has no Intel Mac wheels
            asset: huligennem-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run test_picker.py
      - run: uv run test_gui.py
      # --windowed: no console window, the GUI is the default mode.
      # Windows gets a single .exe; macOS gets an .app bundle, zipped.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            uv run --with pyinstaller pyinstaller --onefile --windowed --name huligennem scrape.py
            mv dist/huligennem.exe "dist/${{ matrix.asset }}"
          else
            uv run --with pyinstaller pyinstaller --windowed --name HULiGENNEM scrape.py
            ditto -c -k --keepParent dist/HULiGENNEM.app "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
